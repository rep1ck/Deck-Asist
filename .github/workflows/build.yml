name: Build Deck Asist Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Ensure assets and PDF font
        run: |
          mkdir -p assets assets/icon assets/fonts
          touch assets/.gitkeep assets/icon/.gitkeep
          if [ ! -f assets/fonts/NotoSans-Regular.ttf ]; then
            curl -sL -o assets/fonts/NotoSans-Regular.ttf \
              "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" \
            || curl -sL -o assets/fonts/NotoSans-Regular.ttf \
              "https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
          fi
          ls -lh assets/fonts/NotoSans-Regular.ttf

      - name: Create Android platform
        run: |
          flutter create . --project-name deck_asist --platforms=android
          rm -rf test
          mkdir -p test
          cat > test/widget_test.dart << 'DART'
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('placeholder', () {
              expect(1 + 1, 2);
            });
          }
          DART

      - name: Allow LAN + camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          if not p.exists():
              raise SystemExit('AndroidManifest.xml not found')
          s = p.read_text(encoding='utf-8')
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]
          for permission in perms:
              if permission not in s:
                  s = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission, s, count=1)
          p.write_text(s, encoding='utf-8')
          print('Permissions OK')
          PY

      - name: Raise minSdk and compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for rel in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = Path(rel)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 24', s)
              s = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', s)
              s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', s)
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', s)
              s = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 35', s)
              s = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', s)
              p.write_text(s, encoding='utf-8')
              print(f'Updated {rel}')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deck-Asist-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
