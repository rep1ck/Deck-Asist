name: Build Deck Asist Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # The repository intentionally keeps platform-generated files out of source control.
      # Flutter creates the Android project deterministically in CI.
      - name: Create Android platform
        run: flutter create . --project-name deck_asist --platforms=android

      - name: Allow LAN networking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('>', '>\n    ' + permission, 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deck-Asist-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
