```yaml
name: Build Deck Asist Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Ensure assets folder
        run: |
          mkdir -p assets
          touch assets/.gitkeep

      - name: Create Android platform
        run: |
          flutter create . --project-name deck_asist --platforms=android
          rm -rf test

      - name: Allow LAN and camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]

          for permission in permissions:
              if permission not in s:
                  s = re.sub(
                      r"(<manifest\b[^>]*>)",
                      r"\1\n    " + permission,
                      s,
                      count=1,
                  )

          p.write_text(s, encoding="utf-8")
          print("Permissions OK")
          PY

      - name: Raise minSdk for plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")

              s = re.sub(
                  r"minSdk\s*=\s*\d+",
                  "minSdk = 24",
                  s,
              )

              s = re.sub(
                  r"minSdkVersion\s+\d+",
                  "minSdkVersion 24",
                  s,
              )

              p.write_text(s, encoding="utf-8")
              print(f"Updated {p}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deck-Asist-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
```
